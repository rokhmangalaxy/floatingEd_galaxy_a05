name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.ver.outputs.code }}
      name: ${{ steps.ver.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: ver
        run: |
          # monotonically increasing versionCode: base + commit count (stable signing key
          # + same applicationId => every new APK installs over the previous one)
          COUNT=$(git rev-list --count HEAD)
          CODE=$((10000 + COUNT))
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            NAME="0.1.0-pr${{ github.event.pull_request.number }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.1.0-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE versionName=$NAME"

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore keystore from secret (optional override)
        env:
          KEY_B64: ${{ secrets.FLOATPIC_KEY_BASE64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            mkdir -p app/keystore
            printf '%s' "$KEY_B64" | base64 -d > app/keystore/floatpic.p12
            echo "using keystore from secret"
          else
            echo "using committed dev keystore"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble release
        env:
          FLOATPIC_STORE_PASSWORD: ${{ secrets.FLOATPIC_STORE_PASSWORD || 'floatpic2026' }}
          FLOATPIC_KEY_PASSWORD: ${{ secrets.FLOATPIC_KEY_PASSWORD || 'floatpic2026' }}
          FLOATPIC_KEY_ALIAS: ${{ secrets.FLOATPIC_KEY_ALIAS || 'floatpic' }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease \
            -PbuildVersionCode=${{ needs.version.outputs.code }} \
            -PbuildVersionName=${{ needs.version.outputs.name }} \
            --no-daemon --stacktrace 2>&1 | tee build.log

      # keep a readable copy of compiler diagnostics inside an issue (no log-download needed)
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TITLE="CI build log"
          BODY=$(tail -c 20000 build.log 2>/dev/null | sed 's/\r//g' || echo "no log")
          NUM=$(gh issue list --label ci-log --state open --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            gh issue create --title "$TITLE" --label ci-log \
              --body "Build log capture. Latest run: ${{ github.run_id }}" >/dev/null
            NUM=$(gh issue list --label ci-log --state open --json number --jq '.[0].number')
          fi
          {
            echo "Run: ${{ github.run_id }} commit: ${GITHUB_SHA:0:7}";
            echo '```'
            echo "$BODY"
            echo '```'
          } > /tmp/comment.md
          gh issue comment "$NUM" --body-file /tmp/comment.md

      - name: Name the artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/FloatPic-${{ needs.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk dist/FloatPic-latest.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: FloatPic-${{ needs.version.outputs.name }}
          path: dist/*
          retention-days: 30

      - name: Publish to rolling release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=apk-latest
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "FloatPic APK" \
              --notes "APK terbaru (build otomatis). Kunci tanda tangan sama di setiap build, jadi versi baru bisa dipasang menimpa tanpa uninstall."
          gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          echo "versionName: ${{ needs.version.outputs.name }} (code ${{ needs.version.outputs.code }})" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/download/apk-latest/FloatPic-latest.apk" >> "$GITHUB_STEP_SUMMARY"
